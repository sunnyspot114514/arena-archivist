# Apply this patch to a pinned DSH v0.1.1-rc.2 checkout.
# Baseline commit: b150a551b8d465e31e418e1b2eaf5e79bbb7d28e
# Always inspect the final tree with: dsh --profile arena --dump-config

name: arena-archivist

# This is intentionally a minimal profile fragment, not a patch over dsh-base.
# Do not load shell, filesystem, web, editor, workflow, subagent, scheduling,
# telemetry, or generic Playwright MCP plugins.
plugins:
  - id: tools
    name: '@deepseek-ai/dsh-tools'
    config:
      mode: native
      maxParallelSubCalls: 1

  - id: arena-tools
    name: '../packages/dsh-profile-arena/src/index.ts'
    config:
      runtimeBaseUrl: http://127.0.0.1:4317

# Session, credential, model, and UI plugins must be added from the same exact
# rc.2 version family for the selected DSH host. The Arena guard rejects any
# tool that is not one of the four arena_* definitions even if one is loaded by
# mistake. Profile review must still confirm the forbidden plugins are absent.
